<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>My Finances</title>
<meta name="theme-color" content="#1F4D35">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F6F1E6; --surface: #FBF8F1; --ink: #1D2820; --muted: #5C685E;
    --green: #1F4D35; --green-ink: #FBF8F1; --line: #E2DACA; --error: #9A3B2E;
    --shadow: 0 1px 2px rgba(31,77,53,.06), 0 8px 24px rgba(31,77,53,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E1913; --surface: #15231B; --ink: #ECE6D6; --muted: #A2AD9F;
      --green: #2E6A4A; --green-ink: #F3EEE2; --line: #23352A; --error: #E38B7C;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.3);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
    background: var(--bg); color: var(--ink);
    font: 16px/1.6 "Manrope", system-ui, sans-serif; -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 22px; padding: 32px 26px; box-shadow: var(--shadow); text-align: center;
  }
  .ring { width: 64px; height: 64px; margin-bottom: 14px; }
  h1 { font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: 1.6rem; margin: 0 0 6px; letter-spacing: -0.01em; }
  p { margin: 0 0 22px; color: var(--muted); font-size: .95rem; }
  input[type=password] {
    width: 100%; font: inherit; font-size: 1.05rem; padding: 13px 16px; border-radius: 14px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink); text-align: center;
  }
  input[type=password]:focus { outline: 2px solid var(--green); outline-offset: 1px; }
  label.remember { display: flex; gap: 8px; align-items: center; justify-content: center; margin: 14px 0 18px; font-size: .88rem; color: var(--muted); }
  button {
    width: 100%; font: inherit; font-weight: 600; padding: 13px 22px; border: 0; border-radius: 999px;
    background: var(--green); color: var(--green-ink); cursor: pointer; box-shadow: var(--shadow);
  }
  button:disabled { opacity: .6; cursor: wait; }
  .msg { min-height: 1.4em; margin-top: 14px; font-size: .9rem; color: var(--error); }
</style>
</head>
<body>
<main class="card">
  <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
    <circle cx="50" cy="50" r="38" fill="none" stroke="var(--line)" stroke-width="14"/>
    <circle cx="50" cy="50" r="38" fill="none" stroke="#1F4D35" stroke-width="14" stroke-dasharray="119 120" transform="rotate(-90 50 50)"/>
    <circle cx="50" cy="50" r="38" fill="none" stroke="#8FA88F" stroke-width="14" stroke-dasharray="68 171" stroke-dashoffset="-123" transform="rotate(-90 50 50)"/>
    <circle cx="50" cy="50" r="38" fill="none" stroke="#B08D57" stroke-width="14" stroke-dasharray="40 199" stroke-dashoffset="-195" transform="rotate(-90 50 50)"/>
  </svg>
  <h1>My Finances</h1>
  <p>This page is private. Enter the passcode to continue.</p>
  <form id="f" autocomplete="off">
    <input id="pw" type="password" placeholder="Passcode" aria-label="Passcode" required autofocus>
    <label class="remember"><input id="remember" type="checkbox" checked> Remember on this device</label>
    <button id="go" type="submit">Unlock</button>
    <div class="msg" id="msg" role="alert"></div>
  </form>
</main>

const KEY_STORE = "myfinances-page-key";
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const toB64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));

async function keyFrom(passcode) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(passcode), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64(LOCKED.salt), iterations: LOCKED.iterations, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
}

async function openPage(key) {
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(LOCKED.iv) }, key, b64(LOCKED.data));
  const html = new TextDecoder().decode(plain);
  document.open(); document.write(html); document.close();
}

// Unlock straight away on a device that chose "Remember".
(async () => {
  let saved = null;
  try { saved = localStorage.getItem(KEY_STORE); } catch (e) {}
  if (!saved) return;
  try {
    const key = await crypto.subtle.importKey("raw", b64(saved), "AES-GCM", false, ["decrypt"]);
    await openPage(key);
  } catch (e) {
    try { localStorage.removeItem(KEY_STORE); } catch (e2) {}
  }
})();

document.getElementById("f").addEventListener("submit", async ev => {
  ev.preventDefault();
  const pw = document.getElementById("pw"), go = document.getElementById("go"), msg = document.getElementById("msg");
  if (!window.crypto || !crypto.subtle) { msg.textContent = "This browser can't open the page. Please use Chrome."; return; }
  go.disabled = true; go.textContent = "Checking…"; msg.textContent = "";
  try {
    const key = await keyFrom(pw.value.trim());
    if (document.getElementById("remember").checked) {
      try { localStorage.setItem(KEY_STORE, toB64(await crypto.subtle.exportKey("raw", key))); } catch (e) {}
    }
    await openPage(key);
  } catch (e) {
    msg.textContent = "That passcode isn't right. Please try again.";
    go.disabled = false; go.textContent = "Unlock"; pw.select();
  }
});
</script>
